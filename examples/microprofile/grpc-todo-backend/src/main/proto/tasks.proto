syntax = "proto3";
import "google/protobuf/empty.proto";
option java_package = "io.helidon.examples.microprofile.grpc";

service TaskService {
  rpc CreateTask (TaskMessage) returns (TaskMessage) {}
  rpc GetTask (IdMessage) returns (StatusMessage) {}
  rpc UpdateTask (StatusMessage) returns (TaskMessage) {}
  rpc DeleteTask (StatusMessage) returns (IdMessage) {}
  rpc GetTasks (google.protobuf.Empty) returns (stream TaskMessage) {}
}

message IdMessage {
  string id = 1;
}

message TaskMessage {
  string id = 1;
  string title = 2;
  bool completed = 3;
}

message StatusMessage {
  string status = 1;
  optional TaskMessage task = 2;
}
